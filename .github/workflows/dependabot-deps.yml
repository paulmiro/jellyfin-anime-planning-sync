name: Update deps.json

on:
  pull_request:
    paths:
      - "**/*.csproj"
      - "**/packages.lock.json"
      - global.json

permissions:
  contents: write

jobs:
  deps:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Regenerate deps.json
        run: nix run .#default.fetch-deps -- deps.json

      - name: Commit changes
        run: |
          if git diff --quiet -- deps.json; then
            echo "deps.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deps.json
          git commit -m "Update deps.json"
          git push
